name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit + API tests (rule engine, workflow, PDF/PowerPoint/OCR intake, AI guardrails)
        run: npm test
      - name: Accuracy evaluation (fails if blocker precision < 90%)
        run: npm run eval
      - name: Build web app
        run: npm run build
      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: |
            docs/eval-report.md
            eval/report.json
